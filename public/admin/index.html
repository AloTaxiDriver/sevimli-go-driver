<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevimli Go — Boshqaruv tizimi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#EDEDED;color:#1A1A1A;height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:6px;}
input,select,textarea,button{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;}

/* Layout */
.app{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:58px;background:#fff;border-bottom:1px solid rgba(0,0,0,0.07);flex-shrink:0;z-index:100;}
.body{display:flex;flex:1;overflow:hidden;}

.main{flex:1;overflow-y:auto;padding:22px 24px;}

/* Logo */
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;}
.logo-icon{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(22,163,74,0.35);}
.logo-text .name{font-weight:800;font-size:15px;color:#1A1A1A;letter-spacing:-0.02em;line-height:1.1;}
.logo-text .sub{font-weight:700;font-size:9px;color:#16A34A;letter-spacing:0.14em;text-transform:uppercase;}

/* Top nav */
.topnav{display:flex;align-items:center;gap:3px;background:#F4F4F4;border-radius:12px;padding:3px;}
.topnav button{background:transparent;border:none;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:rgba(26,26,26,0.5);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.topnav button.active{background:#1A1A1A;color:#fff;}
.topnav button:hover:not(.active){background:rgba(0,0,0,0.05);color:#1A1A1A;}

/* Sidebar icons */


.sdbtn:hover:not(.active){background:rgba(0,0,0,0.06);}
.sdbtn svg{transition:stroke 0.15s;}

/* Cards */
.card{background:#fff;border:1px solid rgba(0,0,0,0.07);border-radius:18px;box-shadow:0 1px 4px rgba(0,0,0,0.04);}

/* Stat cards */
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.statcard{background:#fff;border:1px solid rgba(0,0,0,0.07);border-radius:18px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.statcard.accent{background:linear-gradient(145deg,#22C55E,#16A34A);border:none;box-shadow:0 4px 16px rgba(22,163,74,0.35);}
.statcard .slabel{font-size:12px;color:rgba(26,26,26,0.5);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.statcard.accent .slabel{color:rgba(255,255,255,0.85);}
.statcard .sval{font-size:26px;font-weight:800;color:#1A1A1A;letter-spacing:-0.02em;}
.statcard.accent .sval{color:#fff;}
.statcard .strend{font-size:11px;font-weight:600;margin-top:5px;}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:10px 12px;color:rgba(26,26,26,0.45);font-weight:500;font-size:11px;background:#FAFAFA;border-bottom:1px solid rgba(0,0,0,0.06);}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,0.05);vertical-align:middle;}
.tbl tr:hover td{background:rgba(0,0,0,0.02);}
.tbl tr:last-child td{border-bottom:none;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.btn-coral{background:linear-gradient(145deg,#22C55E,#16A34A);color:#fff;box-shadow:0 3px 10px rgba(22,163,74,0.3);}
.btn-dark{background:#1A1A1A;color:#fff;}
.btn-light{background:#F4F4F4;color:#1A1A1A;border:1px solid rgba(0,0,0,0.08);}
.btn-danger{background:transparent;color:#22C55E;border:1px solid rgba(34,197,94,0.3);}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:8px;}
.btn:active{transform:scale(0.97);}

/* Status dot */
.sdot{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;}
.sdot-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* Pill tags */
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.tag-green{background:rgba(16,185,129,0.12);color:#059669;}
.tag-red{background:rgba(22,163,74,0.1);color:#16A34A;}
.tag-purple{background:rgba(99,102,241,0.1);color:#6366F1;}
.tag-amber{background:rgba(245,158,11,0.1);color:#D97706;}

/* Form */
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;color:rgba(26,26,26,0.5);font-weight:500;}
.form-input{background:#F4F4F4;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500;color:#1A1A1A;width:100%;transition:border 0.15s;}
[contenteditable][data-placeholder]:empty:before{content:attr(data-placeholder);color:rgba(0,0,0,0.35);pointer-events:none;}
.form-input:focus{border-color:#16A34A;}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Checkbox */
.chk-box{width:20px;height:20px;border-radius:6px;border:2px solid rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s;}
.chk-box.checked{background:#16A34A;border-color:#16A34A;}

/* Page layout */
.page-orders{display:flex;gap:16px;align-items:flex-start;}
.order-form{width:330px;flex-shrink:0;}
.order-table{flex:1;min-width:0;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(0,0,0,0.07);}
.modal-body{padding:22px;}

/* Driver cards */
.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.driver-card{background:#fff;border:1px solid rgba(0,0,0,0.07);border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04);}

/* Greeting */
.greeting{margin-bottom:20px;}
.greeting h1{font-size:28px;font-weight:700;letter-spacing:-0.03em;color:#1A1A1A;}
.greeting p{font-size:14px;color:rgba(26,26,26,0.5);margin-top:3px;}

/* Search bar */
.searchbar{display:flex;align-items:center;gap:8px;background:#F4F4F4;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:8px 13px;}
.searchbar input{flex:1;background:transparent;border:none;font-size:13px;color:#1A1A1A;}

/* Extra service item */
.svc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;border:1px solid rgba(0,0,0,0.08);background:#F4F4F4;margin-bottom:6px;}
.svc-item.selected{background:rgba(22,163,74,0.07);border-color:#16A34A;}
.svc-item .svc-name{flex:1;font-size:13px;}
.svc-item.selected .svc-name{font-weight:600;}
.svc-price{font-size:12px;font-weight:600;color:rgba(26,26,26,0.45);}
.svc-item.selected .svc-price{color:#16A34A;}

/* Price breakdown */
.price-box{background:#F4F4F4;border-radius:12px;padding:13px 14px;}
.price-row{display:flex;justify-content:space-between;font-size:12px;color:rgba(26,26,26,0.5);margin-bottom:6px;}
.price-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(0,0,0,0.08);padding-top:10px;margin-top:4px;}
.price-total-val{font-size:22px;font-weight:800;color:#16A34A;}

/* Bonus row */
.bonus-row{display:flex;align-items:center;gap:8px;background:rgba(22,163,74,0.07);border:1px solid rgba(22,163,74,0.2);border-radius:10px;padding:9px 12px;}
.bonus-input{flex:1;background:transparent;border:none;font-size:15px;font-weight:700;color:#16A34A;}

/* Topbar controls */
.topbar-ctrl{width:36px;height:36px;border-radius:10px;background:#F4F4F4;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.topbar-ctrl:hover{background:#E8E8E8;}
.user-pill{display:flex;align-items:center;gap:9px;background:#F4F4F4;border-radius:12px;padding:4px 12px 4px 4px;cursor:pointer;}
.user-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}

/* Notif badge */
.notif-badge{position:absolute;top:6px;right:7px;width:7px;height:7px;background:#22C55E;border-radius:50%;border:1.5px solid #F4F4F4;}

/* Yangiliklar tasmasi (Kun.uz) */
.news-ticker{background:#fff;border:1px solid rgba(0,0,0,0.07);border-radius:16px;margin-bottom:18px;overflow:hidden;display:flex;align-items:center;height:44px;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.news-ticker-label{flex-shrink:0;display:flex;align-items:center;gap:6px;background:linear-gradient(145deg,#22C55E,#16A34A);color:#fff;font-size:12px;font-weight:700;padding:0 16px;height:100%;white-space:nowrap;}
.news-ticker-track-wrap{flex:1;overflow:hidden;position:relative;height:100%;}
.news-ticker-track{display:flex;align-items:center;gap:48px;position:absolute;white-space:nowrap;height:100%;will-change:transform;animation:news-ticker-scroll 45s linear infinite;padding-left:20px;}
.news-ticker-track a{color:#1A1A1A;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
.news-ticker-track a:hover{color:#16A34A;text-decoration:underline;}
.news-ticker-dot{width:5px;height:5px;border-radius:50%;background:#16A34A;flex-shrink:0;}
@keyframes news-ticker-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* Section divider */
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(0,0,0,0.06);}
.sec-title{font-size:15px;font-weight:700;color:#1A1A1A;}

/* More dropdown */
.dropdown{position:relative;}
.dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:13px;padding:5px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,0.12);z-index:200;}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:#1A1A1A;transition:background 0.12s;}
.dropdown-item:hover{background:rgba(0,0,0,0.04);}
.dropdown-item.active{color:#16A34A;background:rgba(22,163,74,0.07);}

/* Hidden */
.hidden{display:none!important;}

/* ============================================================
   MOBIL MOSLASHUV (RESPONSIVE) — 768px va undan tor ekranlar
   ============================================================ */
@media (max-width: 768px){

  /* Butun sahifaning yon tomonga siljib ketishining oldini olish —
     ichkaridagi biror element ekran kengligidan katta bo'lib qolsa
     ham, foydalanuvchi butun sahifani gorizontal surib
     ko'rmasligi kerak (faqat .topnav o'zining ichki aylantirilishini
     saqlaydi). */
  html, body{overflow-x:hidden!important; max-width:100vw;}
  .app, .main, .body{max-width:100vw; overflow-x:hidden;}

  /* "Katta qamrovli" tuzatish: mobilda hech qanday element ekran
     kengligidan oshmasin (.topnav bundan mustasno — u ataylab
     gorizontal aylantiriladi, chunki bo'limlar soni ko'p). Bu
     qaysi aniq element sahifani yon tomonga surib yuborayotganini
     alohida-alohida qidirish o'rniga, muammoni bir zarbada
     yopadi. */
  *:not(.topnav):not(.topnav *):not(.news-ticker):not(.news-ticker *){
    max-width:100%!important;
    box-sizing:border-box!important;
  }

  .order-form-row{
    display:flex!important;
    flex-direction:column!important;
    align-items:stretch!important;
  }
  .order-form-row > div{
    flex:1 1 100%!important;
    width:100%!important;
    min-width:0!important;
    max-width:100%!important;
  }

  /* "Buyurtmalar oynasi" formasidagi 2 ustunli katakchalar
     (Telefon/Mijoz ismi, Filial/Ta'rif va h.k.) — mobilda bitta
     ustunga majburan tushiriladi. !important qo'shildi, chunki
     boshqa joyda ustunlik qiladigan qoida bor edi. */
  .form-grid2{grid-template-columns:1fr!important;}
  .form-grid2 .form-field{width:100%!important;max-width:100%!important;box-sizing:border-box;}

  /* --- TOPBAR / NAVIGATSIYA --- */
  .topbar{
    padding:0 10px;
    gap:8px;
    height:auto;
    min-height:52px;
    flex-wrap:wrap;
    padding-top:6px;
    padding-bottom:6px;
  }
  .logo-text{display:none;} /* joy tejash uchun, faqat ikonka qoladi */
  .topnav{
    order:3;
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    justify-content:flex-start;
    scrollbar-width:none;
  }
  .topnav::-webkit-scrollbar{display:none;}
  .topnav button{white-space:nowrap;flex-shrink:0;}
  .user-pill > div:last-child{display:none;} /* faqat avatar qoladi, ism/rol yashiriladi */
  .topbar-ctrl{width:32px;height:32px;flex-shrink:0;}

  /* --- ASOSIY KONTENT --- */
  .main{padding:12px 10px;}
  .greeting h1{font-size:21px;}

  /* --- STATISTIKA KARTALARI --- */
  .statrow{grid-template-columns:1fr 1fr;gap:10px;}

  /* --- FORMALAR (2 ustunli) --- */
  .form-grid2{grid-template-columns:1fr;}

  /* --- BUYURTMALAR OYNASI: FORMA QATORLARI TIK BO'LADI --- */
  .order-form-row{
  flex-direction:column!important;
  align-items:stretch!important;
  gap:12px!important;
  overflow-x:hidden!important;
}
  .order-form-row > .form-field{flex:none!important;width:100%;max-width:100%;box-sizing:border-box;}
  .order-form-row .form-input,.order-form-row select{max-width:100%;box-sizing:border-box;}
  .order-form-actions{grid-template-columns:1fr 1fr;}
  /* "Qabul qilish" tugmasi mobil ekranda juda tor va yarim kesilgan
     holda ko'rinardi (5-ustunli katakning oxirgi katagi to'liq
     sig'may qolgan edi) — endi butun qatorni egallaydi va
     kattaroq bo'ladi */
  .order-form-actions > *:last-child{
    grid-column:1/-1;
    min-height:56px!important;
    font-size:16px!important;
    margin-top:4px;
  }

  /* --- ESKI (page-orders) MAKET: YON-YONGA O'RNIGA TIK --- */
  .page-orders{flex-direction:column;}
  .order-form{width:100%;}

  /* --- HAYDOVCHILAR KARTOCHKALARI --- */
  .driver-grid{grid-template-columns:1fr;}

  /* --- JADVALLAR: gorizontal aylantirish --- */
  .card{overflow-x:auto;}
  .tbl{min-width:560px;}

  /* --- BO'LIM SARLAVHASI (qidiruv, filtr) --- */
  .sec-head{flex-wrap:wrap;gap:10px;align-items:flex-start;}
  .searchbar{width:100%!important;}

  /* --- MODAL OYNALAR --- */
  .modal-box{max-width:calc(100vw - 24px);}
  .modal-body{padding:16px;}

  /* --- LOGIN EKRANI --- */
  #login-screen > div{margin:0 12px;padding:32px 22px;}
}

@media (max-width: 480px){
  .statrow{grid-template-columns:1fr;}
  .order-form-actions{grid-template-columns:1fr 1fr;}
  .topnav button{font-size:11.5px;padding:7px 9px;}
}
/* YAKUNIY, ENG KUCHLI QOIDA — fayldagi barcha boshqa
     .order-form-row qoidalaridan KEYIN joylashgani uchun, ular
     qayerda va necha marta takrorlangan bo'lishidan qat'iy nazar
     ustun turadi. */
  @media (max-width: 768px){
    .order-form-row{
      display:flex!important;
      flex-direction:column!important;
      align-items:stretch!important;
      overflow-x:hidden!important;
    }
    .order-form-row > *{
      width:100%!important;
      max-width:100%!important;
      min-width:0!important;
      flex:1 1 100%!important;
      box-sizing:border-box!important;
    }
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  // Firebase SDK — Firestore orqali buyurtmalarni haydovchi ilovasiga
  // real vaqtda yetkazish uchun. Bu modul localStorage'ni almashtirmaydi,
  // balki unga QO'SHIMCHA ravishda Firestore'ga ham yozadi, shuning uchun
  // dashboard'ning boshqa barcha funksiyalari (localStorage'ga tayanadigan)
  // o'zgarishsiz ishlayveradi.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    query,
    where,
    orderBy,
    limit,
    getDocs,
    getDoc,
    onSnapshot,
    setDoc,
    doc,
    deleteDoc,
    updateDoc,
    increment,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFunctions,
    httpsCallable,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
  import {
    getStorage,
    ref,
    uploadString,
    getDownloadURL,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
  apiKey: "AIzaSyDcHFdHojN2NBBfgOA8_73oxcbpZ9Ip9Ws",
  authDomain: "sevimli-go.firebaseapp.com",
  projectId: "sevimli-go",
  storageBucket: "sevimli-go.firebasestorage.app",
  messagingSenderId: "185236711706",
  appId: "1:185236711706:web:882d2a3d65bc457cb0e4a3",
  measurementId: "G-64TF2M927F"
};
  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const auth = getAuth(fbApp);
  const storage = getStorage(fbApp);
  const functions = getFunctions(fbApp);

  // Haydovchi rasmini Firebase Storage'ga yuklaydi va ochiq havolasini
  // qaytaradi. MUHIM: rasm hech qachon Firestore hujjatiga to'g'ridan-
  // to'g'ri (base64 holida) yozilmasligi kerak — Firestore hujjat
  // hajmi 1 MB bilan cheklangan, va odatiy rasm shu chegaradan katta
  // bo'lib, yozish jimgina muvaffaqiyatsiz tugaydi. Shuning uchun
  // rasm alohida Storage'ga yuklanadi, Firestore'da esa faqat qisqa
  // URL saqlanadi.
  window.uploadDriverPhotoToStorage = async function (phone, dataUrl) {
    if (!dataUrl || !phone) return null;
    // Agar allaqachon URL (http/https) bo'lsa — demak avval yuklangan,
    // qayta yuklash shart emas
    if (!dataUrl.startsWith('data:')) return dataUrl;
    try {
      const photoRef = ref(storage, `drivers/${phone}/photo.jpg`);
      await uploadString(photoRef, dataUrl, 'data_url');
      return await getDownloadURL(photoRef);
    } catch (err) {
      console.error("Rasmni Storage'ga yuklashda xato:", err);
      return null;
    }
  };

  // MUHIM: Dashboard'ga login qo'shildi — real Firebase Authentication
  // orqali (email + parol). Bu haydovchi ilovasidagi Firestore-asosli
  // vaqtinchalik login usulidan farqli, xavfsizroq, rasmiy usul.
  //
  // Tizimga kirmagan bo'lsa — faqat login ekrani ko'rsatiladi, asosiy
  // dashboard (id="app-root") yashirin turadi.
  onAuthStateChanged(auth, async (user) => {
    const appRoot = document.getElementById('app-root');
    const loginScreen = document.getElementById('login-screen');
    const wasHidden = appRoot && appRoot.style.display === 'none';
    if (user) {
      // MUHIM: rolni Firestore'dan (adminRoles/{uid}) o'qiymiz va
      // TASDIQLANGUNCHA dashboard ko'rsatilmaydi — aks holda ruxsatsiz
      // bo'limlar bir lahza "yaltirab" ko'rinib qolishi mumkin edi.
      // adminRoles hujjati yo'q (yoki roli noto'g'ri) bo'lsa — bu
      // hisobga dashboard'ga kirish huquqi berilmagan deb hisoblanadi
      // va darhol chiqariladi.
      let roleData = null;
      try {
        const roleSnap = await getDoc(doc(db, 'adminRoles', user.uid));
        roleData = roleSnap.exists() ? roleSnap.data() : null;
      } catch (err) {
        console.error("Rolni o'qishda xato:", err);
      }

      if (!roleData || !['admin', 'manager', 'depecher'].includes(roleData.role)) {
        alert("Sizga dashboard'ga kirish huquqi berilmagan. Administratorga murojaat qiling.");
        await signOut(auth);
        return;
      }

      window.currentAdminRole = roleData.role;
      window.currentAdminBranches = roleData.branches || [];
      if (typeof window.applyRoleUIRestrictions === 'function') {
        window.applyRoleUIRestrictions();
      }
      if (typeof window.refreshBranchScopedViews === 'function') {
        window.refreshBranchScopedViews();
      }

      // Rol bilan URL yo'li mos kelmasa (masalan manager /admin'ga
      // kirmoqchi bo'lsa), mos yo'lga qayta yo'naltiramiz — bu
      // Firestore qoidalaridan tashqari qo'shimcha, ko'rinadigan himoya.
      const ROLE_PATHS = { admin: '/admin', manager: '/manager', depecher: '/depecher' };
      const expectedPrefix = ROLE_PATHS[roleData.role];
      if (expectedPrefix && !window.location.pathname.startsWith(expectedPrefix)) {
        window.location.href = expectedPrefix + '/';
        return;
      }

      if (appRoot) appRoot.style.display = '';
      if (loginScreen) loginScreen.style.display = 'none';
      const nameEl = document.getElementById('user-pill-name');
      const avatarEl = document.getElementById('user-pill-avatar');
      const roleEl = document.getElementById('user-pill-role');
      const emailName = (user.email || 'Foydalanuvchi').split('@')[0];
      if (nameEl) nameEl.textContent = emailName;
      if (avatarEl) avatarEl.textContent = emailName.charAt(0).toUpperCase();
      // MUHIM: ilgari bu yorliq har doim statik "Administrator" deb
      // qolardi (haqiqiy rolga qarab hech qachon yangilanmasdi) —
      // shu sabab manager/depecher hisoblarida ham noto'g'ri
      // "Administrator" ko'rsatilardi.
      if (roleEl) {
        const ROLE_LABELS = { admin: 'Administrator', manager: 'Menejer', depecher: 'Depecher' };
        roleEl.textContent = ROLE_LABELS[roleData.role] || roleData.role;
      }
      // Boshqa joylarda (banner, profil) ham ko'rsatish uchun global
      // qilib chiqaramiz — bu module bo'lmagan <script> blokidagi
      // navigate()/renderProfile() funksiyalari ham foydalana oladi.
      window.currentAdminName = emailName;
      window.currentAdminEmail = user.email || '';
      // Faqat haqiqiy login bo'lganda (avval yashirin bo'lsa) joriy
      // sahifani qayta chizamiz — token yangilanishi kabi fon
      // hodisalarida adminning joriy ishini bezovta qilmaslik uchun
      if (wasHidden && typeof window.navigate === 'function') {
        window.navigate(window.currentPage || 'orders');
      }
    } else {
      if (appRoot) appRoot.style.display = 'none';
      if (loginScreen) loginScreen.style.display = 'flex';
    }
  });

  window.handleDashboardLogin = async function () {
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-submit-btn');
    const email = (emailInput?.value || '').trim();
    const password = passwordInput?.value || '';

    if (errorEl) errorEl.textContent = '';

    if (!email || !password) {
      if (errorEl) errorEl.textContent = 'Email va parolni kiriting';
      return;
    }

    if (btn) { btn.disabled = true; btn.textContent = 'Kirilmoqda...'; }
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // Muvaffaqiyatli bo'lsa, onAuthStateChanged o'zi ekranni almashtiradi
    } catch (err) {
      console.error('Login xato:', err);
      if (errorEl) {
        errorEl.textContent =
          err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
            ? 'Email yoki parol noto\u2018g\u2018ri'
            : 'Kirishda xato yuz berdi. Qayta urinib ko\u2018ring.';
      }
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Kirish'; }
    }
  };

  window.handleDashboardLogout = async function () {
    if (!confirm('Tizimdan chiqishni istaysizmi?')) return;
    try {
      await signOut(auth);
    } catch (err) {
      console.error('Chiqishda xato:', err);
    }
  };

  // Global oynaga (window) chiqarib qo'yamiz, shunda pastdagi oddiy
  // <script> (module bo'lmagan) blokdagi submitOrder() funksiyasi
  // ham shu funksiyani chaqira oladi.
  window.sendOrderToFirestore = async function (orderData) {
    try {
      await addDoc(collection(db, "orders"), {
        ...orderData,
        createdAt: serverTimestamp(),
        source: "dashboard",
      });
      console.log("Buyurtma Firestore'ga yuborildi:", orderData);
    } catch (err) {
      console.error("Firestore'ga yozishda xato:", err);
    }
  };

  // MUHIM: bu funksiya attachPhoneAutoFill() (pastdagi oddiy, module
  // bo'lmagan <script> blokida) tomonidan chaqiriladi. Eski kodda
  // to'g'ridan-to'g'ri firebase.firestore()... (v8 uslubi) ishlatilgan
  // edi, lekin bu loyihada v10 MODULAR SDK ishlatilgani uchun
  // "firebase" global obyekt umuman mavjud emas — shuning uchun
  // doimiy "firebase is not defined" xatosi chiqardi. Endi bu global
  // funksiya orqali, to'g'ri (modular) uslubda so'rov yuboriladi.
  window.fetchLastOrderByPhone = async function (phone) {
    try {
      const q = query(
        collection(db, "orders"),
        where("customerPhone", "==", phone),
        orderBy("createdAt", "desc"),
        limit(1)
      );
      const snap = await getDocs(q);
      if (snap.empty) return null;
      return snap.docs[0].data();
    } catch (err) {
      console.error("Oxirgi buyurtmani olishda xato:", err);
      return null;
    }
  };

  // Real vaqtli haydovchilar xaritasi uchun — barcha "drivers"
  // hujjatlarini tinglaydi, o'zgarish bo'lganda callback chaqiriladi.
  // Qaytarilgan funksiya (unsubscribe) sahifadan chiqishda tozalash
  // uchun ishlatiladi.
  window.listenToDriversLive = function (callback) {
    return onSnapshot(
      collection(db, "drivers"),
      (snapshot) => {
        const drivers = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        callback(drivers);
      },
      (err) => {
        console.error("Haydovchilarni tinglashda xato:", err);
      }
    );
  };

  // Mijoz ilovasida telefon orqali ro'yxatdan o'tgan HAQIQIY mijozlar
  // (customers/{uid}) — avval dashboard'ning "Mijozlar" sahifasi bular
  // bilan bog'liq bo'lmagan, faqat mahalliy/soxta ro'yxat ko'rsatardi.
  window.listenToCustomersLive = function (callback) {
    return onSnapshot(
      collection(db, "customers"),
      (snapshot) => {
        const customers = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        callback(customers);
      },
      (err) => {
        console.error("Mijozlarni tinglashda xato:", err);
      }
    );
  };

  // Admin dashboard'dan mijozning bonus hisobiga qo'lda summa qo'shadi
  // (masalan reklama aksiyasi, xatoni tuzatish uchun). MUHIM: bu ham
  // (Cloud Function'dagi onOrderCompletedApplyBonus kabi) bonusHistory'ga
  // yoziladi, shunda mijoz ilovasidagi tarix ro'yxatida ko'rinadi va
  // qayerdan kelgani izlanadi.
  window.addBonusToCustomer = async function (customerId, amount, note) {
    if (!customerId || !(amount > 0)) return;
    try {
      const customerRef = doc(db, "customers", customerId);
      await updateDoc(customerRef, { bonusBalance: increment(amount) });
      await addDoc(collection(customerRef, "bonusHistory"), {
        type: "admin_added",
        amount,
        orderId: "",
        note: note || "Administrator tomonidan qo'shildi",
        createdAt: serverTimestamp(),
      });
    } catch (err) {
      console.error("Mijozga bonus qo'shishda xato:", err);
      throw err;
    }
  };

  // Dashboard'da haydovchi qo'shilganda/tahrirlanganda, uning login
  // uchun kerakli ma'lumotlari (ism, telefon, parol, mashina va h.k.)
  // Firestore'ga yoziladi — hujjat ID'si sifatida TELEFON RAQAMI
  // ishlatiladi, chunki mobil ilova ham xuddi shu ID orqali GPS/band
  // holatini yozadi (driverId = telefon raqami). merge:true bo'lgani
  // uchun, mobil ilova yozgan lat/lng/isOnline/busy maydonlari
  // o'chirilmaydi.
  window.saveDriverToFirestore = async function (phone, driverData) {
    if (!phone) return;
    try {
      await setDoc(doc(db, "drivers", phone), driverData, { merge: true });
    } catch (err) {
      console.error("Haydovchini Firestore'ga yozishda xato:", err);
    }
  };

  // Haydovchi modalidagi "Bonus" tabi uchun — Cloud Function
  // (onOrderCompletedCheckDriverBonus) yozgan drivers/{id}/bonusHistory
  // ro'yxatini o'qiydi, eng yangisidan boshlab.
  window.getDriverBonusHistory = async function (driverId) {
    if (!driverId) return [];
    try {
      const snap = await getDocs(
        query(collection(db, "drivers", driverId, "bonusHistory"), orderBy("date", "desc"))
      );
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    } catch (err) {
      console.error("Haydovchi bonus tarixini o'qishda xato:", err);
      return [];
    }
  };

  // Haydovchi modalidagi "Bonus" tabining "Faol maqsad" / "O'tgan
  // davrlar" ko'rinishi uchun — dailyBonusStats/weeklyBonusStats
  // hujjatlarining o'zini o'qiydi (bonusHistory'dan farqli, bu yerda
  // hali yutilmagan/davom etayotgan davr ham bor, progress-bar uchun).
  window.getDriverBonusGoals = async function (driverId) {
    if (!driverId) return { daily: [], weekly: [] };
    try {
      const [dailySnap, weeklySnap] = await Promise.all([
        getDocs(query(collection(db, "drivers", driverId, "dailyBonusStats"), orderBy("date", "desc"), limit(14))),
        getDocs(
          query(collection(db, "drivers", driverId, "weeklyBonusStats"), orderBy("weekStart", "desc"), limit(8))
        ),
      ]);
      return {
        daily: dailySnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        weekly: weeklySnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      };
    } catch (err) {
      console.error("Haydovchi bonus maqsadlarini o'qishda xato:", err);
      return { daily: [], weekly: [] };
    }
  };

  window.saveTariffToFirestore = async function (tariffId, tariffData) {
    if (!tariffId) return;
    try {
      await setDoc(doc(db, "tariffs", tariffId), tariffData, { merge: true });
    } catch (err) {
      console.error("Tarifni Firestore'ga yozishda xato:", err);
      // MUHIM: bu yozuv muvaffaqiyatsiz bo'lsa, dashboard'ning o'z UI'si
      // baribir "saqlandi" ko'rinishida qoladi (chunki u localStorage'dan
      // o'qiydi) — shuning uchun bu xatoni ko'rinadigan qilib ko'rsatish
      // kerak, aks holda admin buni sezmaydi va mijoz ilovasi hech qachon
      // yangilanishni ko'rmaydi.
      alert("Tarifni serverga saqlashda xatolik yuz berdi (ehtimol rasm hajmi juda katta): " + (err?.message || err));
    }
  };

  window.deleteTariffFromFirestore = async function (tariffId) {
    if (!tariffId) return;
    try {
      await deleteDoc(doc(db, "tariffs", tariffId));
    } catch (err) {
      console.error("Tarifni Firestore'dan o'chirishda xato:", err);
      alert("Tarifni serverdan o'chirishda xatolik yuz berdi: " + (err?.message || err));
    }
  };

  // MUHIM: "Buyurtmalar" sahifasi avval faqat localStorage'dan
  // ishlar edi — bu funksiya "Haydovchilar" sahifasidagi
  // listenToDriversLive bilan bir xil naqshda, orders kolleksiyasini
  // REAL VAQTDA tinglaydi. Shunda dispetcher tomonidan yaratilgan
  // buyurtma HAM, haydovchi mobil ilovada qabul qilgan/bekor
  // qilgan/yakunlagan o'zgarishlar HAM darhol dashboard'da ko'rinadi.
  window.listenToOrdersLive = function (callback) {
    return onSnapshot(
      collection(db, "orders"),
      (snapshot) => {
        const orders = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        callback(orders);
      },
      (err) => {
        console.error("Buyurtmalarni tinglashda xato:", err);
      }
    );
  };

  // Buyurtma hujjatini qisman yangilash uchun (masalan: holat,
  // haydovchi, narx). patch — o'zgartiriladigan maydonlar obyekti.
  window.updateOrderInFirestore = async function (orderId, patch) {
    if (!orderId) return;
    try {
      await updateDoc(doc(db, "orders", orderId), patch);
    } catch (err) {
      console.error("Buyurtmani yangilashda xato:", err);
    }
  };

  window.deleteOrderFromFirestore = async function (orderId) {
    if (!orderId) return;
    try {
      await deleteDoc(doc(db, "orders", orderId));
    } catch (err) {
      console.error("Buyurtmani o'chirishda xato:", err);
    }
  };

  // Dispetcher tomonidan bekor qilish — sababi bilan birga yoziladi.
  // Mobil ilova tomonida ham xuddi shu maydon nomlari (cancelReason,
  // cancelledBy) ishlatiladi, shunda ikkala tomon bir xil sxemaga ega
  // bo'ladi.
  // Dispetcher "Bildirishnoma" bo'limidan xabar yuborganda —
  // Firestore'ga yozadi. Cloud Function (onNewNotificationSendPush)
  // shu hujjatni ko'rib, mos haydovchilarga push jo'natadi, mobil
  // ilovadagi qo'ng'iroqcha belgisida ham darhol ko'rinadi.
  // MUHIM: rasm bu yerda ham (haydovchi rasmidagi kabi) xom base64
  // holida emas, Storage orqali yuklanadi — aks holda Firestore'ning
  // 1MB hujjat chegarasi tufayli (rasm base64'ga aylanganda hajmi
  // ~33% oshadi) yozish jimgina muvaffaqiyatsiz tugaydi va xabar
  // umuman yuborilmaydi.
  window.uploadNotificationImageToStorage = async function (dataUrl) {
    if (!dataUrl) return null;
    if (!dataUrl.startsWith('data:')) return dataUrl;
    try {
      const imgRef = ref(storage, `notifications/${Date.now()}.jpg`);
      await uploadString(imgRef, dataUrl, 'data_url');
      return await getDownloadURL(imgRef);
    } catch (err) {
      console.error("Bildirishnoma rasmini Storage'ga yuklashda xato:", err);
      return null;
    }
  };
  window.sendNotificationToFirestore = async function (data) {
    try {
      let imageUrl = data.image || null;
      if (imageUrl && imageUrl.startsWith('data:')) {
        imageUrl = await window.uploadNotificationImageToStorage(imageUrl);
      }
      await addDoc(collection(db, "notifications"), {
        ...data,
        image: imageUrl,
        createdAt: serverTimestamp(),
      });
    } catch (err) {
      console.error("Bildirishnomani Firestore'ga yozishda xato:", err);
    }
  };
  window.cancelOrderFromDashboard = async function (orderId, reason) {
    if (!orderId) return;
    try {
      await updateDoc(doc(db, "orders", orderId), {
        status: "cancelled",
        cancelReason: reason || "Sabab ko'rsatilmagan",
        cancelledBy: "dispatcher",
        cancelledAt: serverTimestamp(),
      });
    } catch (err) {
      console.error("Buyurtmani bekor qilishda xato:", err);
    }
  };

  // Buyurtmalar jadvalida haydovchi ismini ko'rsatish uchun — bir
  // martalik so'rov (onSnapshot emas), chunki bu yerda faqat ism
  // kerak, real vaqtli holat kerak emas (u "Haydovchilar" sahifasida
  // allaqachon bor).
  window.fetchDriversMapOnce = async function () {
    try {
      const snap = await getDocs(collection(db, "drivers"));
      const map = {};
      snap.docs.forEach((d) => {
        const data = d.data();
        map[d.id] =
          ((data.firstName || "") + " " + (data.lastName || "")).trim() ||
          d.id;
      });
      return map;
    } catch (err) {
      console.error("Haydovchilar ro'yxatini olishda xato:", err);
      return {};
    }
  };

  window.deleteDriverFromFirestore = async function (phone) {
    if (!phone) return;
    try {
      await deleteDoc(doc(db, "drivers", phone));
    } catch (err) {
      console.error("Haydovchini Firestore'dan o'chirishda xato:", err);
    }
  };
// ============================================================
  // UNIVERSAL DASHBOARD SYNC — barcha bo'limlar (filiallar, tariflar,
  // mijozlar, ishchilar, xizmatlar, manzillar va h.k.) endi Firestore
  // orqali barcha kompyuterlarda bir xil ko'rinishi uchun
  // ============================================================
  window.syncDashboardDataToFirestore = async function (key, value) {
    try {
      await setDoc(doc(db, "dashboardData", key), { value: JSON.stringify(value), updatedAt: serverTimestamp() });
    } catch (err) {
      console.error("Dashboard ma'lumotini Firestore'ga yozishda xato:", err);
    }
  };

  window.fetchDashboardDataFromFirestore = async function (key) {
    try {
      const snap = await getDocs(collection(db, "dashboardData"));
      const found = snap.docs.find((d) => d.id === key);
      if (!found) return null;
      const data = found.data();
      return data.value ? JSON.parse(data.value) : null;
    } catch (err) {
      console.error("Dashboard ma'lumotini Firestore'dan o'qishda xato:", err);
      return null;
    }
  };

  window.listenToDashboardDataLive = function (key, callback) {
    return onSnapshot(
      doc(db, "dashboardData", key),
      (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          callback(data.value ? JSON.parse(data.value) : null);
        }
      },
      (err) => {
        console.error("Dashboard ma'lumotini tinglashda xato:", err);
      }
    );
  };
  window.getRadiusConfig = async function () {
    try {
      const snap = await getDocs(collection(db, "settings"));
      const found = snap.docs.find((d) => d.id === "radiusConfig");
      return found ? found.data() : null;
    } catch (err) {
      console.error("Radius sozlamalarini olishda xato:", err);
      return null;
    }
  };

  window.saveRadiusConfig = async function (cfg) {
    try {
      await setDoc(doc(db, "settings", "radiusConfig"), cfg, { merge: true });
    } catch (err) {
      console.error("Radius sozlamalarini yozishda xato:", err);
    }
  };

  // Mijozlar uchun bonus (cashback) sozlamasi — settings/bonus hujjati.
  // MUHIM: bonusBalance'ning o'zi bu yerda emas, faqat Cloud Function
  // (onOrderCompletedApplyBonus) orqali o'zgaradi — bu shunchaki qoidalar.
  window.getClientBonusSettings = async function () {
    try {
      const snap = await getDocs(collection(db, "settings"));
      const found = snap.docs.find((d) => d.id === "bonus");
      return found ? found.data() : null;
    } catch (err) {
      console.error("Bonus sozlamalarini olishda xato:", err);
      return null;
    }
  };

  window.saveClientBonusSettings = async function (cfg) {
    try {
      await setDoc(doc(db, "settings", "bonus"), cfg, { merge: true });
    } catch (err) {
      console.error("Bonus sozlamalarini yozishda xato:", err);
    }
  };

  // Haydovchilar uchun kunlik bonus sozlamasi — settings/driverBonus
  // hujjati. MUHIM: haydovchi balansining o'zi bu yerda emas, faqat
  // Cloud Function (onOrderCompletedCheckDriverBonus) orqali o'zgaradi —
  // bu shunchaki qoidalar (necha safar, qancha bonus, minimal masofa).
  window.getDriverBonusSettings = async function () {
    try {
      const snap = await getDocs(collection(db, "settings"));
      const found = snap.docs.find((d) => d.id === "driverBonus");
      return found ? found.data() : null;
    } catch (err) {
      console.error("Haydovchi bonus sozlamalarini olishda xato:", err);
      return null;
    }
  };

  window.saveDriverBonusSettings = async function (cfg) {
    try {
      await setDoc(doc(db, "settings", "driverBonus"), cfg, { merge: true });
    } catch (err) {
      console.error("Haydovchi bonus sozlamalarini yozishda xato:", err);
    }
  };

  // Xodimga dashboard kirish huquqi (email+parol, rol) berish —
  // Cloud Function orqali, chunki Firebase Auth hisobini yaratish
  // Admin SDK talab qiladi (client SDK bunga qodir emas). Faqat
  // 'admin' rolidagi joriy foydalanuvchi chaqira oladi — buni
  // funksiya o'zi ham qayta tekshiradi.
  window.createStaffDashboardAccess = async function (payload) {
    try {
      const callable = httpsCallable(functions, "createStaffAccount");
      const result = await callable(payload);
      return { ok: true, uid: result.data.uid };
    } catch (err) {
      console.error("Xodim hisobini yaratishda xato:", err);
      return { ok: false, error: err.message || "Xatolik yuz berdi" };
    }
  };

  // Kirish huquqini bekor qilish — Firebase Auth hisobining o'zi
  // qoladi, faqat adminRoles hujjati o'chiriladi, shundan keyin
  // keyingi kirish urinishida "ruxsat yo'q" deb rad etiladi.
  window.revokeStaffDashboardAccess = async function (uid) {
    try {
      await deleteDoc(doc(db, "adminRoles", uid));
      return true;
    } catch (err) {
      console.error("Kirish huquqini bekor qilishda xato:", err);
      return false;
    }
  };

  // MUHIM: hisob yaratilgandan keyin uning filial(lar)ini o'zgartirish
  // uchun ilgari umuman imkoniyat yo'q edi (adminRoles/{uid}.branches
  // faqat createStaffAccount'da, bir marta yoziladi) — shu sabab
  // filial keyinroq qo'shilsa yoki noto'g'ri belgilansa, xodim
  // hech qanday ma'lumot ko'rmay qolardi. Bu — to'g'ridan-to'g'ri
  // client yozuvi (Cloud Function emas), chunki Firestore qoidalari
  // (adminRoles/{uid} write) allaqachon buni faqat 'admin' rolga
  // ruxsat beradi.
  window.updateStaffBranches = async function (uid, branches) {
    try {
      await setDoc(doc(db, "adminRoles", uid), { branches: Array.isArray(branches) ? branches : [] }, { merge: true });
      return true;
    } catch (err) {
      console.error("Xodim filial(lar)ini yangilashda xato:", err);
      return false;
    }
  };
</script>
</head>
<body>
<div class="app" id="app-root" style="display:none">
<header class="topbar">
  <a class="logo" onclick="navigate('orders')">
    <div class="logo-icon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    <div class="logo-text">
      <div class="name">Sevimli Go
      </div>
      <div class="sub">Express</div>
    </div>
  </a>

  <nav class="topnav">
    <button onclick="navigate('orders')" id="nav-orders" class="active">Asosiy</button>
    <button onclick="navigate('balance')" id="nav-balance">Balans</button>
    <button onclick="navigate('statistics')" id="nav-statistics">Statistika</button>

function dbGet(k){try{const v=localStorage.getItem(KEYS[k]);if(v)return JSON.parse(v);localStorage.setItem(KEYS[k],JSON.stringify(SEED[k]));return SEED[k];}catch{return SEED[k]||[];}}
function dbSet(k,v){try{localStorage.setItem(KEYS[k],JSON.stringify(v));if(window.syncDashboardDataToFirestore)window.syncDashboardDataToFirestore(k,v);}catch{}}
function dbAdd(k,item){const d=dbGet(k);d.unshift({...item,id:uid(),created:now()});dbSet(k,d);return d;}
function dbUpdate(k,id,patch){const d=dbGet(k).map(x=>x.id===id?{...x,...patch}:x);dbSet(k,d);return d;}
function dbDelete(k,id){const d=dbGet(k).filter(x=>x.id!==id);dbSet(k,d);return d;}

// Rol asosidagi kirish ruxsati — /admin, /manager, /depecher bo'limlari
// uchun. `null` — cheklovsiz (hammasiga kira oladi). Bu ro'yxat
// FAQAT interfeysni (tugmalar/menyu) boshqaradi — haqiqiy ma'lumot
// himoyasi Firestore xavfsizlik qoidalarida amalga oshiriladi.
const ROLE_ALLOWED_PAGES={
  admin:null,
  manager:['orders','notifications','balance','branches','drivers','tariffs','map','groups','addresses','clients','orderhistory','calllog','statistics','bonussettings','profile'],
  depecher:['orders','notifications','map','profile'],
};

function isPageAllowedForRole(page){
  const allowed=ROLE_ALLOWED_PAGES[window.currentAdminRole];
  return !allowed||allowed.includes(page);
}

// ============================================================
// FILIAL (BRANCH) KO'LAMI — admin cheklovsiz (null qaytaradi),
// manager/depecher esa faqat o'ziga (adminRoles/{uid}.branches)
// biriktirilgan filial(lar) bilan cheklanadi. Bu FAQAT dashboard
// darajasidagi himoya (interfeys+so'rovlar) — haqiqiy server
// himoyasi qo'llanadigan joylarda (masalan tariflar) alohida
// Firestore qoidalarida ham takrorlanadi.
// ============================================================
function getAllowedBranchIds(){
  if(window.currentAdminRole==='admin')return null; // cheklovsiz
  return Array.isArray(window.currentAdminBranches)?window.currentAdminBranches:[];
}
function isBranchAllowed(branchId){
  const allowed=getAllowedBranchIds();
  if(allowed===null)return true;
  if(!branchId)return false;
  return allowed.includes(branchId);
}
// Har bir element (order/driver/tariff...) uchun uning filial(lar)ini
// hisoblab beruvchi `getIds(item)=>string|string[]|null` funksiyasi
// orqali massivni joriy foydalanuvchiga ruxsat etilgan elementlargacha
// qisqartiradi. `getIds` bo'sh/null qaytarsa (masalan filial
// tanlanmagan tarif = "hammaga umumiy") — element hamma uchun ko'rinadi.
function filterByAllowedBranches(list,getIds){
  const allowed=getAllowedBranchIds();
  if(allowed===null)return list; // admin
  return (list||[]).filter(item=>{
    let ids=getIds(item);
    if(ids===null||ids===undefined||ids==='')return true; // umumiy/tayinlanmagan — hammaga ko'rinadi
    if(!Array.isArray(ids))ids=[ids];
    ids=ids.filter(Boolean);
    if(ids.length===0)return true;
    return ids.some(id=>allowed.includes(id));
  });
}
// filterByAllowedBranches'dan farqli o'laroq — filial ANIQLANMAGAN
// element bu yerda "hammaga umumiy" emas, balki FAQAT ADMINGA
// ko'rinadi. Buyurtmalar/haydovchilar kabi, filial tizimi joriy
// etilishidan oldingi eski yozuvlar uchun ishlatiladi — chunki
// ularning filiali "atayin umumiy qilib belgilangan" emas, shunchaki
// hali ko'chirilmagan, va menejerlarga tasodifan boshqa filial
// ma'lumotini ko'rsatib qo'ymasligi kerak.
function filterByAllowedBranchesStrict(list,getIds){
  const allowed=getAllowedBranchIds();
  if(allowed===null)return list; // admin
  return (list||[]).filter(item=>{
    let ids=getIds(item);
    if(!Array.isArray(ids))ids=ids?[ids]:[];
    ids=ids.filter(Boolean);
    if(ids.length===0)return false; // tayinlanmagan — faqat admin ko'radi
    return ids.some(id=>allowed.includes(id));
  });
}
// Yozuv/o'chirish oldidan chaqiriladi: menejer/depecher o'ziga
// tegishli bo'lmagan filialning yozuvini o'zgartirishga urinsa,
// ogohlantirib to'xtatadi. `branchIds` bitta id yoki id massivi
// (yoki umumiy/tayinlanmagan bo'lsa null/bo'sh) bo'lishi mumkin.
function guardBranchWrite(branchIds){
  const allowed=getAllowedBranchIds();
  if(allowed===null)return true; // admin
  let ids=branchIds;
  if(ids===null||ids===undefined||ids==='')return true; // umumiy — hammaga ochiq tahrirlash (masalan yangi umumiy tarif)
  if(!Array.isArray(ids))ids=[ids];
  ids=ids.filter(Boolean);
  if(ids.length===0)return true;
  const ok=ids.some(id=>allowed.includes(id));
  if(!ok)alert("Bu yozuv sizning filialingizga tegishli emas — o'zgartira olmaysiz.");
  return ok;
}
// Filial tanlash ro'yxatlarini (yangi haydovchi/buyurtma/tarif
// yaratishda) joriy foydalanuvchiga ruxsat etilgan filiallar bilan
// cheklaydi. Admin uchun to'liq ro'yxat qaytadi.
function getSelectableBranches(){
  const all=dbGet('branches')||[];
  const allowed=getAllowedBranchIds();
  if(allowed===null)return all;
  return all.filter(b=>allowed.includes(b.id));
}

// to'g'ridan-to'g'ri olib tashlaymiz).
function applyRoleUIRestrictions(){
  const allowed=ROLE_ALLOWED_PAGES[window.currentAdminRole];
  if(!allowed)return; // admin — cheklovsiz
  document.querySelectorAll('[id^="nav-"]').forEach(btn=>{
    const page=btn.id.replace('nav-','');
    if(page&&!allowed.includes(page))btn.style.display='none';
  });
  let anyDropdownVisible=false;
  document.querySelectorAll('.dropdown-item[data-page]').forEach(item=>{
    const page=item.getAttribute('data-page');
    if(page&&!allowed.includes(page)){item.style.display='none';}
    else{anyDropdownVisible=true;}
  });
  const moreBtn=document.getElementById('more-btn');
  if(moreBtn&&!anyDropdownVisible)moreBtn.style.display='none';
}

function getDistanceKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

function getRouteDistanceKm(){
  const addresses=dbGet('addresses');
  const fromName=document.getElementById('f-from')?.value;
  const toName=document.getElementById('f-to')?.value;
  if(!fromName||!toName)return 0;
  const fromAddr=addresses.find(a=>a.name===fromName);
  const toAddr=addresses.find(a=>a.name===toName);
  if(!fromAddr||!toAddr||fromAddr.lat==null||toAddr.lat==null)return 0;
  return getDistanceKm(fromAddr.lat,fromAddr.lng,toAddr.lat,toAddr.lng);
}

// Firestore buyurtma hujjatini dashboard'ning jadval/statistika
// kutayotgan shaklga o'giradi (customerName -> client, fromAddress ->
// from va h.k.). MUHIM: maydon nomlari mobil ilovadagi
// src/utils/firebase.ts'dagi FirestoreOrder turi bilan BIR XIL
// bo'lishi shart, aks holda ma'lumot noto'g'ri o'qiladi.
function normalizeFirestoreOrder(o){
  return {
    id:o.id,
    client:o.customerName||"Noma’lum mijoz",
    phone:o.customerPhone||'',
    from:o.fromAddress||'',
    to:o.toAddress||'',
    to2:o.toAddress2||'',
    tariff:o.tariffName||'',
    price:typeof o.price==='number'?o.price:0,
    driver:o.driverId||null,
    branch:o.branchId||null,
    note:o.note||'',
    status:o.status||'pending',
    cancelReason:o.cancelReason||'',
    cancelledBy:o.cancelledBy||'',
    distance:typeof o.distanceKm==='number'?o.distanceKm:0,
    createdAtMillis:o.createdAt&&o.createdAt.toMillis?o.createdAt.toMillis():(o.createdAt&&o.createdAt.seconds?o.createdAt.seconds*1000:0),
  };
}

function driverNameFor(driverId){
  if(!driverId)return null;
  const live=firestoreDriversList.find(d=>d.id===driverId);
  if(live)return live.name;
  if(orderDriverNames[driverId])return orderDriverNames[driverId];
  return driverId;
}

function afterRenderOrders(){
  calcTotal();
  attachPhoneAutoFill();
  // MUHIM: tinglovchi endi bu yerda EMAS, global (sahifa yuklanganda
  // bir marta) ishga tushiriladi — pastdagi startGlobalOrdersListener()
  // ga qarang. Sababi: yon panjaradagi "Faol buyurtmalar" belgisi
  // "Buyurtmalar" sahifasi ochilmagan bo'lsa ham real ma'lumot
  // ko'rsatishi kerak.
  renderMiniStats();
  renderOrdersTable();
  // Haydovchi ismlarini bir marta oldindan yuklab olamiz (jadvalda
  // ko'rsatish uchun) — agar hali yuklanmagan bo'lsa
  if(Object.keys(orderDriverNames).length===0&&window.fetchDriversMapOnce){
    window.fetchDriversMapOnce().then(map=>{orderDriverNames=map;renderOrdersTable();});
  }
}

async function runPhoneAutoFill(phone){
  phone=(phone||'').trim();
  if(phone.length<9)return;
  if(!window.fetchLastOrderByPhone){console.warn('fetchLastOrderByPhone hali tayyor emas');return;}
  try{
    const last=await window.fetchLastOrderByPhone(phone);
    if(!last)return;

    // 1. Mijoz ismi
    const clientInp=document.getElementById('f-client');
    if(clientInp&&last.customerName&&last.customerName!=="Noma'lum mijoz"){
      clientInp.value=last.customerName;
    }

    // 2. Filial
    if(last.branchId){
      const branchSel=document.getElementById('f-branch');
      if(branchSel)branchSel.value=last.branchId;
    }

    // 3. Ta'rif — select'ning value'si tarif ID'si, nomi emas, shuning
    // uchun nomdan ID'ni topib qo'yamiz (aks holda hech qachon mos kelmaydi).
    if(last.tariffName){
      const tariffSel=document.getElementById('f-tariff');
      if(tariffSel){
        const tariffs=dbGet('tariffs');
        const match=tariffs.find(t=>t.name===last.tariffName);
        if(match)tariffSel.value=match.id;
        calcTotal();
      }
    }

    // 4. Qayerdan - manzil guruhi va manzil
    if(last.fromAddress){
      const addresses=dbGet('addresses');
      const fromAddr=addresses.find(a=>a.name===last.fromAddress);
      if(fromAddr&&fromAddr.group){
        const groupSel=document.getElementById('f-group');
        if(groupSel){groupSel.value=fromAddr.group;filterAddrs();}
      }
      const fromSel=document.getElementById('f-from');
      if(fromSel)fromSel.value=last.fromAddress;
    }

    // 5. Qayerga - manzil guruhi va manzil
    if(last.toAddress){
      const addresses=dbGet('addresses');
      const toAddr=addresses.find(a=>a.name===last.toAddress);
      if(toAddr&&toAddr.group){
        const groupToSel=document.getElementById('f-group-to');
        if(groupToSel){groupToSel.value=toAddr.group;filterAddrsTo();}
      }
      const toSel=document.getElementById('f-to');
      if(toSel)toSel.value=last.toAddress;
    }

    calcTotal();
  }catch(e){console.warn('Oxirgi buyurtma xato:',e);}
}

function attachPhoneAutoFill(){
  const inp=document.getElementById('f-phone');
  if(!inp||inp._afl)return;
  inp._afl=true;
  inp.addEventListener('blur',function(){runPhoneAutoFill(this.value);});
}
function renderMiniStats(){
  const orders=firestoreOrdersList;
  const stats=[
    {label:'Jami',val:orders.length,color:'#16A34A'},
    {label:'Faol',val:orders.filter(o=>o.status==='accepted'||o.status==='in_progress').length,color:'#10B981'},
    {label:'Kutilmoqda',val:orders.filter(o=>o.status==='pending').length,color:'#F59E0B'},
    {label:'Bajarildi',val:orders.filter(o=>o.status==='completed').length,color:'#6366F1'},
  ];
  const el=document.getElementById('mini-stats');
  if(el)el.innerHTML=stats.map(s=>`<div class="statcard"><div class="slabel">${s.label}</div><div class="sval" style="color:${s.color}">${s.val}</div></div>`).join('');
}

  const tbl=document.getElementById('orders-table');
  if(!tbl)return;
  if(filtered.length===0){tbl.innerHTML=`<tr><td colspan="7" style="text-align:center;padding:40px;color:rgba(26,26,26,0.4)">Buyurtma topilmadi</td></tr>`;return;}

  tbl.innerHTML=`<thead><tr>

  </tr></thead><tbody>${filtered.map(o=>{
    const driverName=driverNameFor(o.driver);
    const canCancel=CANCELLABLE_STATUSES.includes(o.status);

    const actions=`<div style="display:flex;gap:4px;align-items:center;white-space:nowrap">

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

// Bosqichli (pog'onali) km-narxlash: har bir bosqich o'ziga tegishli
// km-oralig'ida (oldingi bosqich chegarasidan shu bosqichning "km"
// qiymatigacha) alohida narx/km bo'yicha hisoblanadi. Oxirgi bosqichda
// "km" ko'rsatilmaydi — u "va undan keyin" (cheksiz) sifatida ishlaydi.
function tieredDistanceSurcharge(distanceBeyondMin,tiers){
  if(!Array.isArray(tiers)||tiers.length===0)return 0;
  let remaining=distanceBeyondMin;
  let prevBoundary=0;
  let total=0;
  for(let i=0;i<tiers.length&&remaining>1e-9;i++){
    const tier=tiers[i];
    const isLast=i===tiers.length-1;
    const tierWidth=isLast?Infinity:Math.max(0,(tier.km||0)-prevBoundary);
    const segment=Math.min(remaining,tierWidth);
    if(segment>0){
      total+=segment*(tier.pricePerKm||0);
      remaining-=segment;
    }
    prevBoundary=tier.km||prevBoundary;
  }
  return total;
}
// Tarif va masofaga qarab xom (yaxlitlanmagan) bazaviy narxni hisoblaydi
// — bosqichli narxlash yoqilgan bo'lsa priceTiers, aks holda eski flat
// perKm formulasi ishlatiladi. calcTotal() va submitOrder()da bir xil
// natija chiqishi uchun ikkalasi shu funksiyani chaqiradi.
function computeTariffRawBase(trf,routeDistanceKm){
  const minDistance=trf?.minDistance||0;
  const distanceBeyondMin=Math.max(0,routeDistanceKm-minDistance);
  const distanceSurcharge=trf?.tieredPricing
    ?tieredDistanceSurcharge(distanceBeyondMin,trf.priceTiers)
    :distanceBeyondMin*(trf?.perKm||0);
  return (trf?.minDistancePrice||0)+distanceSurcharge;
}
function calcTotal(){
  const tariffs=dbGet('tariffs');
  const sel=document.getElementById('f-tariff')?.value;
  const trf=tariffs.find(t=>t.id===sel)||tariffs[0]||{minDistancePrice:0};
  const routeDistanceKm=getRouteDistanceKm();
  // MUHIM: narx 1000 so'mlikka yuqoriga yaxlitlanadi (masalan 20916.6
  // -> 21000), shunda kasrli, "chiroyli bo'lmagan" summa chiqmaydi.
  const rawBase=computeTariffRawBase(trf,routeDistanceKm);
  const base=Math.ceil(rawBase/1000)*1000;
  const extras=selectedExtras.reduce((s,e)=>s+e.price,0);
  const bonus=useBonus?Math.min(parseInt(document.getElementById('bonus-amt')?.value)||0,base+extras):0;
  const total=Math.max(0,base+extras-bonus);
  const el=n=>document.getElementById(n);
  if(el('base-price-disp'))el('base-price-disp').textContent=base.toLocaleString()+' so’m';
  if(el('extras-disp'))el('extras-disp').textContent='+'+extras.toLocaleString()+' so’m';
  if(el('extras-row'))el('extras-row').style.display=extras>0?'flex':'none';
  if(el('bonus-disp'))el('bonus-disp').textContent='−'+bonus.toLocaleString()+' so’m';
  if(el('bonus-row-disp'))el('bonus-row-disp').style.display=bonus>0?'flex':'none';
  if(el('total-price'))el('total-price').textContent=total.toLocaleString()+' so’m';
}

function submitOrder(){
  const client=document.getElementById('f-client')?.value?.trim()||'Noma\u2019lum mijoz';
  const phone=document.getElementById('f-phone')?.value?.trim();
  const from=document.getElementById('f-from')?.value;
  // MUHIM: bo'sh qoldirilsa '' (bo'sh satr) qolishi kerak, "Belgilanmagan"
  // kabi matn EMAS — aks holda mobil ilova buni haqiqiy B manzil deb
  // hisoblab, koordinata topilmagani uchun haydovchi joylashuvi yaqinida
  // tasodifiy B nuqta o'ylab topadi va uni xaritada ko'rsatadi.
  const to=document.getElementById('f-to')?.value?.trim()||'';
  if(!phone||!from){alert("Telefon va qayerdan majburiy!");return;}
  const tariffs=dbGet('tariffs');
  const sel=document.getElementById('f-tariff')?.value;
  const trf=tariffs.find(t=>t.id===sel)||tariffs[0]||{minDistancePrice:0};
  const routeDistanceKm=getRouteDistanceKm();
  const rawBase=computeTariffRawBase(trf,routeDistanceKm);
  const base=Math.ceil(rawBase/1000)*1000;
  const extras=[...selectedExtras];
  const extrasTotal=extras.reduce((s,e)=>s+e.price,0);
  const bonusAmt=useBonus?Math.min(parseInt(document.getElementById('bonus-amt')?.value)||0,base+extrasTotal):0;
  const total=Math.max(0,base+extrasTotal-bonusAmt);
  // MUHIM: driverSel bo'sh qoldirilsa (operator aniq haydovchi tanlamasa),
  // buyurtma "umumiy pool"ga tushadi va barcha online haydovchilarga
  // ko'rinadi. Avvalgi versiyada bo'sh haydovchi avtomatik tanlanardi,
  // lekin bu haydovchi ilovasidagi "qabul qilish/o'tkazib yuborish"
  // oqimiga to'g'ri kelmaydi, shuning uchun avtomatik tanlash olib
  // tashlandi.
  const driver=document.getElementById('f-driver')?.value||'';
  const branchId=document.getElementById('f-branch')?.value||null;
  if(branchId&&!guardBranchWrite(branchId))return;
  const note=document.getElementById('f-note')?.value||'';
  const distance=Math.round(routeDistanceKm*10)/10;
  // MUHIM: bu yerda ENDI localStorage'ga (dbAdd) yozilmaydi —
  // "Buyurtmalar" sahifasi to'liq Firestore'dan (firestoreOrdersList)
  // o'qiydi, shuning uchun pastdagi sendOrderToFirestore yozgan
  // hujjat tinglovchi (onSnapshot) orqali avtomatik ravishda
  // jadvalda paydo bo'ladi — ikkilamchi (va sinxronlashmay qoladigan)
  // local nusxa yaratishning hojati yo'q.
  //
  // Haydovchi statusini darhol "band" qilish OLIB TASHLANDI — chunki
  // haydovchi hali buyurtmani qabul qilmagan. Status faqat haydovchi
  // ilovada "Qabul qilish" tugmasini bosgandan keyin o'zgaradi
  // (bu Firestore orqali, haydovchi tomonidan amalga oshiriladi).

  const addresses=dbGet('addresses');
  const fromAddr=addresses.find(a=>a.name===from);
  const toAddr=addresses.find(a=>a.name===to);
  // Firestore'ga ham yuboramiz, shunda haydovchi ilovasi buni real
  // vaqtda ko'radi. driver bo'sh bo'lsa, bu "pool" buyurtmasi bo'ladi.
  if (window.sendOrderToFirestore) {
    window.sendOrderToFirestore({
      status: 'pending',
      driverId: driver || null,
      customerName: client,

// tashkentWeekStartStr bilan BIR XIL mantiq (aks holda "faol davr"
// dashboard'da boshqa kun/hafta bo'lib qolishi mumkin).
function dashboardTashkentDateStr(d=new Date()){
  const shifted=new Date(d.getTime()+5*60*60*1000);
  return shifted.toISOString().slice(0,10);
}
function dashboardTashkentWeekStartStr(d=new Date()){
  const shifted=new Date(d.getTime()+5*60*60*1000);
  const day=shifted.getUTCDay();
  const diffToMonday=day===0?6:day-1;
  const monday=new Date(shifted);
  monday.setUTCDate(shifted.getUTCDate()-diffToMonday);
  return monday.toISOString().slice(0,10);
}
const UZ_MONTHS=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function formatUzDate(dateStr){
  if(!dateStr)return '';
  const d=new Date(dateStr+'T00:00:00Z');
  return `${d.getUTCDate()}-${UZ_MONTHS[d.getUTCMonth()]}`;
}
function formatUzWeekRange(weekStartStr){
  if(!weekStartStr)return '';
  const start=new Date(weekStartStr+'T00:00:00Z');
  const end=new Date(start.getTime()+6*24*60*60*1000);
  const sameMonth=start.getUTCMonth()===end.getUTCMonth();
  return sameMonth
    ?`${start.getUTCDate()}–${end.getUTCDate()} ${UZ_MONTHS[start.getUTCMonth()]}`
    :`${start.getUTCDate()} ${UZ_MONTHS[start.getUTCMonth()]} – ${end.getUTCDate()} ${UZ_MONTHS[end.getUTCMonth()]}`;
}

        const dailyIsActive=settings?.dailyEnabled!==false;
        const weeklyIsActive=typeof settings?.weeklyEnabled==='boolean'?settings.weeklyEnabled:((settings?.weeklyTripThreshold||0)>0);
        const fallbackDailyThreshold=settings?.dailyTripThreshold||0;
        const fallbackDailyAmount=settings?.bonusAmount||0;
        const fallbackWeeklyThreshold=settings?.weeklyTripThreshold||0;
        const fallbackWeeklyAmount=settings?.weeklyBonusAmount||0;

        const todayDoc=goals.daily.find(x=>x.id===todayStr);
        const weekDoc=goals.weekly.find(x=>x.id===weekStartStr);
        const pastDaily=goals.daily.filter(x=>x.id!==todayStr);
        const pastWeekly=goals.weekly.filter(x=>x.id!==weekStartStr);

        const activeCards=[
          driverGoalCard({
            label:'Bugungi maqsad',dateLabel:'Bugun',isPast:false,
            count:todayDoc?.qualifyingTripCount||0,
            threshold:dailyIsActive?(todayDoc?.tripThreshold||fallbackDailyThreshold):0,
            amount:todayDoc?.targetBonusAmount||fallbackDailyAmount,
          }),
          driverGoalCard({
            label:'Haftalik maqsad',dateLabel:formatUzWeekRange(weekStartStr),isPast:false,
            count:weekDoc?.qualifyingTripCount||0,
            threshold:weeklyIsActive?(weekDoc?.tripThreshold||fallbackWeeklyThreshold):0,
            amount:weekDoc?.targetBonusAmount||fallbackWeeklyAmount,
          }),
        ].filter(Boolean).join('');

        const pastDailyCards=pastDaily.slice(0,7).map(x=>driverGoalCard({
          label:'Kunlik',dateLabel:formatUzDate(x.date||x.id),isPast:true,achieved:x.bonusAwarded===true,
          count:x.qualifyingTripCount||0,threshold:x.tripThreshold||fallbackDailyThreshold,amount:x.targetBonusAmount||fallbackDailyAmount,
        })).filter(Boolean).join('');

        const pastWeeklyCards=pastWeekly.slice(0,6).map(x=>driverGoalCard({
          label:'Haftalik',dateLabel:formatUzWeekRange(x.weekStart||x.id),isPast:true,achieved:x.bonusAwarded===true,
          count:x.qualifyingTripCount||0,threshold:x.tripThreshold||fallbackWeeklyThreshold,amount:x.targetBonusAmount||fallbackWeeklyAmount,
        })).filter(Boolean).join('');

        el.innerHTML=`
          ${activeCards?`<div style="font-size:12px;font-weight:700;color:rgba(0,0,0,0.4);margin-bottom:8px">FAOL MAQSADLAR</div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">${activeCards}</div>`:''}
          ${pastDailyCards?`<div style="font-size:12px;font-weight:700;color:rgba(0,0,0,0.4);margin-bottom:8px">O'TGAN KUNLAR</div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">${pastDailyCards}</div>`:''}
          ${pastWeeklyCards?`<div style="font-size:12px;font-weight:700;color:rgba(0,0,0,0.4);margin-bottom:8px">O'TGAN HAFTALAR</div>
          <div style="display:flex;flex-direction:column;gap:10px">${pastWeeklyCards}</div>`:''}
          ${(!activeCards&&!pastDailyCards&&!pastWeeklyCards)?`<div style="text-align:center;padding:20px 0;color:rgba(0,0,0,0.35);font-size:12px">Hali bonus tarixi yo’q</div>`:''}
        `;
      });
    }
  }
}

function driverDocUploadBox(key,label){
  const img=window._driverPhotos[key];
  return `<div onclick="document.getElementById('driver-doc-input-${key}').click()" style="border:1.5px dashed rgba(0,0,0,0.15);border-radius:11px;padding:${img?'0':'18px 10px'};text-align:center;cursor:pointer;transition:all 0.15s;background:#FAFAFA;min-height:90px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative" onmouseenter="this.style.borderColor='#16A34A'" onmouseleave="this.style.borderColor='rgba(0,0,0,0.15)'">
    ${img?`<img src="${img}" style="width:100%;height:90px;object-fit:cover">
      <button type="button" onclick="event.stopPropagation();removeDriverDoc('${key}')" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.6);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center">${ic('x',11,'#fff')}</button>`
      :`<div>${ic('image',18,'rgba(0,0,0,0.3)')}<div style="font-size:11px;color:rgba(0,0,0,0.45);margin-top:5px;font-weight:600">${label}</div></div>`}
    <input type="file" id="driver-doc-input-${key}" accept="image/*" style="display:none" onchange="handleDriverImageUpload(event,'${key}')">
  </div>`;
}

function handleDriverImageUpload(event,key){
  const file=event.target.files?.[0];
  if(!file)return;
  if(file.size>5*1024*1024){alert('Rasm hajmi 5MB dan oshmasligi kerak!');return;}
  const reader=new FileReader();
  reader.onload=(e)=>{
    window._driverPhotos[key]=e.target.result;
    if(key==='photo'){
      const wrap=document.getElementById('driver-photo-preview-wrap');
      if(wrap)wrap.innerHTML=`<img id="driver-photo-preview" src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;
    }else{
      renderDriverTabContent();
    }
  };
  reader.readAsDataURL(file);
}

function removeDriverDoc(key){
  window._driverPhotos[key]=null;
  renderDriverTabContent();
}

async function saveDriver(id){
  cacheCurrentDriverTabFields();
  const cache=window._driverFormCache||{};
  const modal=document.getElementById('driver-modal');
  const orig=modal?JSON.parse(modal.dataset.driverData||'{}'):{};
  const merged={...orig,...cache};

  if(!merged.firstName||!merged.lastName||!merged.phone){
    switchDriverTab('personal');
    alert('Ism, familiya va telefon raqamini kiriting!');
    return;
  }

  if(!guardBranchWrite(merged.branch)||(orig.branch&&!guardBranchWrite(orig.branch)))return;

  if(merged.password&&merged.password!==merged.passwordConfirm){
    switchDriverTab('password');
    alert('Parollar bir xil emas!');
    return;
  }

  const plateRegion=merged.plateRegion||PLATE_REGIONS[0];
  const plateBody=merged.plateBody||'';

  const finalData={
    firstName:merged.firstName,lastName:merged.lastName,
    name:merged.firstName+' '+merged.lastName,
    phone:merged.phone,branch:merged.branch||'',status:merged.status||'free',
    selfEmployed:!!window._driverSelfEmployed,
    photo:window._driverPhotos.photo||null,
    car:merged.car||'',carBrand:merged.carBrand||'',carModel:merged.carModel||'',carColor:merged.carColor||'',
    tariffs:[...(window._driverSelectedTariffs||[])],tariff:(window._driverSelectedTariffs||[])[0]||'',
    plateRegion,plateBody,plate:plateRegion+plateBody,
    branded:!!window._driverBranded,
    licenseFront:window._driverPhotos.licenseFront||null,
    licenseBack:window._driverPhotos.licenseBack||null,
    idFront:window._driverPhotos.idFront||null,
    idBack:window._driverPhotos.idBack||null,
    password:merged.password||orig.password||'',
  };

  // MUHIM: rasm Firestore'ga xom (base64) holida emas, Firebase
  // Storage orqali yuklab, faqat qisqa URL sifatida yoziladi —
  // aks holda Firestore'ning 1MB hujjat chegarasi tufayli yozish
  // jimgina muvaffaqiyatsiz tugab, rasm hech qachon saqlanmas edi.
  let photoUrl=finalData.photo;
  if(photoUrl&&photoUrl.startsWith('data:')&&window.uploadDriverPhotoToStorage){
    const saveBtn=document.querySelector('#driver-modal .btn-coral');
    const prevBtnText=saveBtn?saveBtn.textContent:'';
    if(saveBtn){saveBtn.textContent='Rasm yuklanmoqda...';saveBtn.disabled=true;}
    photoUrl=await window.uploadDriverPhotoToStorage(finalData.phone,photoUrl);
    if(saveBtn){saveBtn.textContent=prevBtnText;saveBtn.disabled=false;}
  }

  if(id){
    dbUpdate('drivers',id,finalData);
    if(window.saveDriverToFirestore){
      window.saveDriverToFirestore(finalData.phone,{
        firstName:finalData.firstName,
        lastName:finalData.lastName,
        phone:finalData.phone,
        password:finalData.password,
        branch:finalData.branch,
        carBrand:finalData.carBrand,
        carModel:finalData.carModel,
        carColor:finalData.carColor,
        car:finalData.car,
        plateRegion,
        plateBody,
        plate:finalData.plate,
        photo:photoUrl,
      });
    }
  }else{
    const newDriverData={...finalData,rating:5.0,trips:0,balance:0,joined:new Date().toISOString().slice(0,10)};
    dbAdd('drivers',newDriverData);
    if(window.saveDriverToFirestore){
      window.saveDriverToFirestore(newDriverData.phone,{
        firstName:newDriverData.firstName,
        lastName:newDriverData.lastName,
        phone:newDriverData.phone,
        password:newDriverData.password,
        branch:newDriverData.branch,
        carBrand:newDriverData.carBrand,
        carModel:newDriverData.carModel,
        carColor:newDriverData.carColor,
        car:newDriverData.car,
        plateRegion,
        plateBody,
        plate:newDriverData.plate,
        rating:newDriverData.rating,
        balance:newDriverData.balance,
        photo:photoUrl,
      });
    }
  }
  window._driverFormCache=null;
  closeModal('driver-modal');
  navigate('drivers');
}

function updateClientStats(){
  const total=document.getElementById('clients-stat-total');
  const withBonus=document.getElementById('clients-stat-with-bonus');
  const bonusSum=document.getElementById('clients-stat-bonus-sum');
  let customers=firestoreCustomersList;
  const allowedBranches=getAllowedBranchIds();
  if(allowedBranches!==null){
    const allowedPhones=new Set(firestoreOrdersList.map(o=>o.phone).filter(Boolean));
    customers=customers.filter(c=>allowedPhones.has(c.phone));
  }
  if(total)total.textContent=customers.length;
  if(withBonus)withBonus.textContent=customers.filter(c=>(c.bonusBalance||0)>0).length;
  if(bonusSum)bonusSum.textContent=customers.reduce((s,c)=>s+(c.bonusBalance||0),0).toLocaleString();
}
function renderClientsTable(search=''){
  clientSearchQuery=search;
  // MUHIM: mijoz (customers) hujjatida filial tushunchasi tabiiy
  // ravishda yo'q — kimdir istalgan filialdan buyurtma berishi mumkin.
  // Shu sabab menejer/depecher uchun ro'yxat, o'ziga ruxsat etilgan
  // filial(lar)dan KAMIDA BITTA buyurtma bergan mijozlar bilan
  // cheklanadi (allaqachon filial bo'yicha filtrlangan
  // firestoreOrdersList orqali).
  let customers=firestoreCustomersList;
  const allowedBranches=getAllowedBranchIds();
  if(allowedBranches!==null){
    const allowedPhones=new Set(firestoreOrdersList.map(o=>o.phone).filter(Boolean));
    customers=customers.filter(c=>allowedPhones.has(c.phone));
  }
  if(search){
    const q=search.toLowerCase();
    customers=customers.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q));
  }
  const el=document.getElementById('clients-table');
  if(!el)return;
  if(!customers.length){
    el.innerHTML=`<tbody><tr><td style="padding:20px;color:rgba(0,0,0,0.4)">Mijoz topilmadi</td></tr></tbody>`;
    return;
  }
  el.innerHTML=`<thead><tr><th>Mijoz</th><th>Telefon</th><th>Bonus balansi</th><th style="white-space:nowrap">Amal</th></tr></thead>
  <tbody>${customers.map(c=>`<tr>
    <td><div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#22C55E,#16A34A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0">${(c.name||'?')[0].toUpperCase()}</div>
      <span style="font-weight:600">${esc(c.name||'Noma’lum mijoz')}</span></div></td>
    <td style="color:rgba(26,26,26,0.5);font-size:12px">${esc(c.phone||'')}</td>
    <td style="font-weight:700">${(c.bonusBalance||0).toLocaleString()} so’m</td>
    <td><div style="display:flex;gap:5px">
      <button class="btn btn-light btn-sm" onclick="showClientModal('${c.id}')">${ic('edit',13)}</button>
    </div></td>
  </tr>`).join('')}</tbody>`;
}

async function addBonusToClient(id){
  const amount=parseFloat(document.getElementById('cm-bonus-amount')?.value);
  const note=document.getElementById('cm-bonus-note')?.value||'';
  if(!(amount>0)){alert('Miqdorni to’g’ri kiriting!');return;}
  if(!window.addBonusToCustomer)return;
  try{
    await window.addBonusToCustomer(id,amount,note);
    alert('Bonus qo’shildi!');
    closeModal('client-modal');
  }catch(err){
    alert('Bonus qo’shishda xatolik yuz berdi: '+(err?.message||err));
  }
}

// Statistika sahifasi filtrlari — global saqlanadi, shunda "Ko'rish"
// bosilganda tanlangan qiymatlar yo'qolib ketmaydi (avval har safar
// bugungi sanaga qaytarib yuborar edi, chunki filtr holati hech
// qayerda saqlanmas edi).
let statFilters={branch:'',tariff:'',from:'',to:''};

function getFilteredOrders(){
  const fromMs=statFilters.from?new Date(statFilters.from+'T00:00:00').getTime():0;
  const toMs=statFilters.to?new Date(statFilters.to+'T23:59:59').getTime():Infinity;
  return firestoreOrdersList.filter(o=>{
    const t=o.createdAtMillis||0;
    if(t<fromMs||t>toMs)return false;
    if(statFilters.branch&&o.branch!==statFilters.branch)return false;
    if(statFilters.tariff&&o.tariff!==statFilters.tariff)return false;
    return true;
  });
}

// ============================================================
// HISOBOT (CSV eksport) — Statistika sahifasidagi joriy filtrga
// mos buyurtmalar ro'yxatini Excel'da ochiladigan CSV fayl sifatida
// yuklab beradi
// ============================================================
function exportOrdersCSV(){
  const orders=getFilteredOrders();
  if(orders.length===0){alert('Tanlangan filtr bo\u2019yicha buyurtma topilmadi.');return;}
  const statusLabels={pending:'Kutilmoqda',accepted:'Qabul qilindi',in_progress:'Yo\u2019lda',completed:'Bajarildi',cancelled:'Bekor qilingan'};
  const header=['ID','Sana','Mijoz','Telefon','Qayerdan','Qayerga','Tarif','Narx','Haydovchi','Holat','Bekor sababi'];
  const rows=orders.map(o=>[
    o.id,
    o.createdAtMillis?new Date(o.createdAtMillis).toLocaleString('uz-UZ'):'',
    o.client,o.phone,o.from,o.to,o.tariff,o.price,
    driverNameFor(o.driver)||'',
    statusLabels[o.status]||o.status,
    o.cancelReason||'',
  ]);
  const csvEscape=(v)=>{
    const s=String(v==null?'':v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  };
  const csv='\uFEFF'+[header,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`buyurtmalar_${statFilters.from||'hammasi'}_${statFilters.to||'hammasi'}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  // Animate SVG progress rings (stroke-dashoffset fill-in)
  document.querySelectorAll('.stat-ring').forEach(ring=>{
    const pct=parseFloat(ring.dataset.pct)||0;
    const circumference=201; // 2*PI*32, matches r=32 used in markup
    const offset=circumference-(circumference*Math.min(pct,100)/100);
    // Force a reflow before transitioning so the CSS transition actually fires
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        ring.style.strokeDashoffset=offset;
      });
    });
  });

  // Animate counting numbers from 0 to target
  document.querySelectorAll('.stat-count').forEach(el=>{
    const target=parseInt(el.dataset.target)||0;
    const duration=1100;
    const startTime=performance.now();
    function tick(now){
      const elapsed=now-startTime;
      const progress=Math.min(elapsed/duration,1);
      const eased=1-Math.pow(1-progress,3); // ease-out cubic
      const current=Math.round(target*eased);
      el.textContent=current.toLocaleString();
      if(progress<1)requestAnimationFrame(tick);
      else el.textContent=target.toLocaleString();
    }
    requestAnimationFrame(tick);
  });
}

// yozilardi. Shu sabab avval `branchId`ga, u bo'lmasa haydovchining HOZIRGI
// haqiqiy filialiga qaraymiz. Filial umuman aniqlanmasa — tariflardan farqli
// o'laroq, bu yerda "hammaga umumiy" emas, balki faqat ADMIN ko'radi

// statistik kartalar (renderBalance) VA tranzaksiyalar jadvali
// (renderBalanceTable) — ikkalasi ham shu bitta manbadan hisoblanishi kerak,
// aks holda kartalar boshqa filialning summasini ko'rsatib qo'yishi mumkin.
function getScopedDriverTxns(){
  const allowedBranches=getAllowedBranchIds();
  return (dbGet('driverTxns')||[]).filter(t=>{
    if(allowedBranches===null)return true; // admin
    let bId=t.branchId;
    if(!bId){
      const drv=firestoreDriversListRaw.find(d=>d.id===t.driverId);
      bId=drv?drv.branch:null;
    }
    return bId&&allowedBranches.includes(bId);
  });
}

function renderBalanceTable(filter){
  const txns=getScopedDriverTxns();
  const f=(filter||'').toLowerCase();
  const filtered=f?txns.filter(t=>
    (t.driverName||'').toLowerCase().includes(f)||
    (t.branch||'').toLowerCase().includes(f)||
    (t.reason||'').toLowerCase().includes(f)||
    shortId(t.driverId).includes(f)||
    (t.driverId||'').toLowerCase().includes(f)
  ):txns;
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const tbody=document.getElementById('balance-tbody');
  if(!tbody)return;
  if(!sorted.length){
    tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:#aaa">Tranzaksiyalar topilmadi</td></tr>';
    return;
  }
  tbody.innerHTML=sorted.map((t,i)=>{
    const d=new Date(t.date);
    const UZ_MON_SHORT=['Yan','Fev','Mar','Apr','May','Iyun','Iyul','Avg','Sen','Okt','Noy','Dek'];
    const dateStr=d.getDate()+' '+UZ_MON_SHORT[d.getMonth()]+' '+d.getFullYear()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(t.branch||'—')}</td>
      <td><span style="color:#6366F1;font-weight:700;cursor:pointer;font-family:monospace;font-size:12px" onclick="showAccountModal('${t.driverId}')">${shortId(t.driverId)}</span></td>
      <td><span style="color:#2563EB;font-weight:600;cursor:pointer" onclick="showAccountModal('${t.driverId}')">${esc(t.driverName)}</span></td>
      <td><span style="font-size:12px;font-weight:600;color:${t.type==='income'?'#16A34A':'#16A34A'}">${t.type==='income'?'Kirim':'Chiqim'}</span></td>
      <td style="font-weight:700;color:${t.type==='income'?'#16A34A':'#16A34A'}">${t.type==='income'?'+':'\u2212'}${t.amount.toLocaleString()} so\u2019m</td>

      <td style="color:rgba(0,0,0,0.45);font-size:12px">${dateStr}</td>
    </tr>`;
  }).join('');
}
